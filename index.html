<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de Transferencia</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #0072ce;
      font-size: 20px;
    }
    .data-box {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      color: #1e293b;
      white-space: pre-line;
      margin-bottom: 20px;
    }
    .btn-copy {
      background-color: #0072ce;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-copy:active {
      background-color: #00569e;
      transform: scale(0.98);
    }
    .toast {
      margin-top: 12px;
      font-size: 13px;
      color: #16a34a;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Datos de Transferencia</h2>

    <!-- Recuadro con los datos -->
    <div class="data-box" id="datos">José Tomás Edwards Baeza
RUT: 186408985
Mercado Pago
Cuenta Vista
Número de cuenta: 1062382082
jtomasedwardsb@gmail.com</div>

    <!-- Botón único para copiar todo -->
    <button class="btn-copy" onclick="copiarTodo()">Copiar todos los datos</button>
    <div class="toast" id="mensaje">¡Copiado al portapapeles!</div>
  </div>

  <script>
    function copiarTodo() {
      const texto = document.getElementById("datos").innerText;
      
      navigator.clipboard.writeText(texto).then(() => {
        const mensaje = document.getElementById("mensaje");
        mensaje.style.opacity = "1";
        setTimeout(() => {
          mensaje.style.opacity = "0";
        }, 2000);
      }).catch(err => {
        console.error("Error al copiar: ", err);
      });
    }
  </script>

</body>
</html>
